[package]
name = "redux-rs"
version = "0.4.0"
description = "A Rust implementation of Redux."
authors = ["Jeroen Vervaeke <jeroen@vervaeke.nu>", "Jan Baudisch <dev@baudisch.xyz>"]
license = "MIT"
homepage = "https://github.com/redux-rs/redux-rs"
repository = "https://github.com/redux-rs/redux-rs.git"
readme = "README.md"
edition = "2024"
rust-version = "1.88"

[package.metadata.docs.rs]
all-features = true

[dependencies]
log = { version = "0.4", optional = true }
tokio = { version = "1", features = [ "sync", "rt" ], optional = true }

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = [ "sync", "rt", "rt-multi-thread", "time", "macros" ] }

[features]
default = []
logger = [ "dep:log" ]
thunk = []
tokio = [ "dep:tokio" ]

[[example]]
name = "basic_todo"

[[example]]
name = "logger_middleware"
required-features = [ "logger" ]

[[example]]
name = "thunk_middleware_fn"
required-features = [ "thunk" ]

[[example]]
name = "thunk_middleware_trait"
required-features = [ "thunk" ]

[[example]]
name = "typed_middleware"
required-features = [ "logger", "thunk" ]
